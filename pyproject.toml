[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evogine"
version = "0.1.0"
description = "Self-evolving agentic engine: git-backed learning, a builder/verifier/reflector swarm, two objective gates, and a decay-pressure benchmark."
readme = "README.md"
requires-python = ">=3.12"
keywords = [
    "agents",
    "llm",
    "agentic",
    "self-evolving",
    "swarm",
    "code-repair",
    "benchmark",
    "pydantic",
    "anthropic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    # Pinned to the range the extra_body temperature routing was live-verified
    # against: 1.6.0 rejects the typed temperature kwarg client-side (TypeError
    # on every live run), so anything below 1.6 is untested and 2.x may change
    # the surface again.
    "anthropic>=1.6,<2",
    "pydantic>=2",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[project.scripts]
evogine = "evogine.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"
# Case corpus files are runtime fixtures: the benchmark gate and the corpus
# invariants (tests/test_cases.py) are their discipline, not package lint.
# Package-layout cases also intentionally duplicate module basenames across
# reference/ and degraded/ trees, which import-sorting treats as one package.
extend-exclude = ["src/evogine/bench/cases"]

[tool.pytest.ini_options]
# Case files under bench/cases/*/test_suite.py are run by the benchmark gate
# against a `candidate` module that only exists during evaluation; they are
# not pytest-collectable and must stay out of the normal test run.
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# The bench gate evaluates candidate/model output: any exception raised there
# is a recorded outcome (a fail verdict), not a harness crash.  That boundary
# catch is the design, not a lint slip.
"src/evogine/bench/gate.py" = ["BLE001"]

[tool.mypy]
# Case corpus files shadow module names by design (each evaluates as a
# standalone `candidate` module); they are gate-validated, not type-checked.
mypy_path = "src"
exclude = ["cases/"]

[tool.hatch.build.targets.wheel]
packages = ["src/evogine"]
