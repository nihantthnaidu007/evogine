name: CI

# Lint (ruff) then test (pytest) on Python 3.12, for pushes to main and all
# pull requests. No secrets: the scaffold suite makes no live API calls.
#
# lint-and-test runs only the local subprocess executor: the DockerSandbox
# tests (test_docker_* in tests/test_sandbox.py and tests/test_memory_gate.py)
# skip when the sandbox image is absent. The docker-gates job closes that
# coverage gap — GitHub-hosted runners provide Docker natively (no service
# container, no secrets, no artifacts): it builds the pinned sandbox image
# (the same one-time build documented in src/evogine/gates/sandbox.py), asserts
# the tests' literal skipif condition is satisfied, and runs exactly the
# Docker-gated tests. No secrets: the sandbox has no network and the suite
# makes no live API calls.
#
# The gitleaks job scans the full repository history for leaked secrets on
# every push and pull request. Checkout uses fetch-depth: 0 because a default
# shallow clone would leave push-event scans covering only the newest commit
# instead of the full history. The action is pinned by commit SHA (the commit
# the v2 tag points at), not the moving tag. No secrets introduced: the only
# token passed is the workflow's own GITHUB_TOKEN.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: pip install -r requirements.lock

      - name: Install the package itself
        run: pip install -e . --no-deps

      - name: Ruff lint
        run: ruff check .

      # Coverage floor: fail the job if total coverage drops below the pinned
      # value (the level the suite actually measures; raise, never lower, it
      # as tests land).
      - name: Pytest with coverage floor
        run: pytest -q --cov=evogine --cov-fail-under=88

  docker-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: pip install -r requirements.lock

      - name: Install the package itself
        run: pip install -e . --no-deps

      # Pinned base (python:3.13-slim@sha256:c33f...4f, multi-arch manifest
      # digest) resolves to the amd64 image on x86_64 runners, so the CI-built
      # image matches the one developers build locally.
      - name: Build the pinned sandbox image
        run: docker build -f docker/Dockerfile.sandbox -t evogine-sandbox:py313 docker/

      # The Docker-gated tests skip iff `docker image inspect
      # evogine-sandbox:py313` fails. Asserting that exact condition here
      # means a green job cannot be a silent skip: if the image were missing,
      # the job fails here instead of passing vacuously.
      - name: Confirm the tests' skipif condition is satisfied
        run: docker image inspect evogine-sandbox:py313 > /dev/null

      # -k docker selects exactly the eight Docker-gated tests (test_docker_*:
      # six in tests/test_sandbox.py and two in tests/test_memory_gate.py);
      # the rest of the suite stays with lint-and-test. The grep guard fails
      # the job if any selected test is skipped anyway.
      - name: Run the Docker-gated gate tests
        run: |
          set -o pipefail
          pytest -k docker -q -rs 2>&1 | tee /tmp/pytest-docker.log
          if grep -Eq '[0-9]+ skipped' /tmp/pytest-docker.log; then
            echo "::error::Docker-gated tests were skipped despite the built sandbox image — failing the job"
            exit 1
          fi

  gitleaks:
    runs-on: ubuntu-latest
    # Least privilege for the action's PR-scan API calls: on pull_request
    # events it lists the PR's commits (GET /pulls/<n>/commits requires
    # pull-requests: read). The default private-repo token lacks that scope,
    # which failed the scan with 403 "Resource not accessible by integration"
    # (gitleaks#1343). contents: read covers the checkout and push-event scans.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Full history is required: on push events a shallow clone would
          # leave the scan covering only the newest commit, not the whole
          # history (the pull_request trigger scans the PR's full diff range).
          fetch-depth: 0

      # Pin by the commit SHA the v2 tag resolves to, not the tag: a mutable
      # tag could silently swap the code that scans for (or approves) secrets.
      - name: Scan full history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          # The workflow's own token; the action uses it for GitHub API access.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
